<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>오프라인 상태입니다 • 다-잇다잉</title>
  <meta name="theme-color" content="#eb0000" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { --brand: #eb0000; --bg: #f5f5f5; }
    * { box-sizing: border-box; }
    body { 
      margin:0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; 
      background: var(--bg); 
      color: #1a1a1a; 
    }
    .wrap { 
      min-height: 100dvh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 24px; 
    }
    .card { 
      max-width: 480px; 
      width: 100%; 
      background: #fff; 
      border-radius: 16px; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); 
      padding: 32px 24px; 
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: var(--brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .logo {
      font-family: 'Luckiest Guy', cursive;
      font-size: 1.25rem;
      color: var(--brand);
      margin-bottom: 8px;
    }
    h1 { 
      margin: 0 0 12px; 
      color: #1a1a1a; 
      font-size: 1.5rem; 
      font-weight: 700;
    }
    p { 
      margin: 0 0 12px; 
      line-height: 1.6; 
      color: #666;
    }
    .hint { 
      color: #999; 
      font-size: 0.875rem; 
    }
    a.btn { 
      display: inline-block; 
      margin-top: 20px; 
      background: var(--brand); 
      color: #fff; 
      padding: 12px 24px; 
      border-radius: 8px; 
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    a.btn:hover {
      background: #d00000;
      transform: translateY(-1px);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">📡</div>
      <div class="logo">Da-Itdaing</div>
      <h1>오프라인 상태입니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <p class="hint">인터넷 연결이 복구되면 자동으로 최신 정보를 불러옵니다.</p>
      <a class="btn" href="/">홈으로 이동</a>
    </div>
  </div>
</body>
</html>
