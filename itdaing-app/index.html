  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker 등록 -->
    <script>
      (function() {
        if (!('serviceWorker' in navigator)) return;
        
        const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
        const isProduction = location.protocol === 'https:';
        
        window.addEventListener('load', () => {
          // 로컬 개발 환경: SW 해제
          if (isLocalDev) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(reg => reg.unregister());
            });
            console.info('[PWA] Dev 환경 - Service Worker 비활성화');
            return;
          }
          
          // HTTPS 프로덕션 환경: SW 등록
          if (isProduction) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(reg => {
                // console.log('[PWA] Service Worker 등록 성공');
                
                // 새 버전 감지 시 알림
                reg.addEventListener('updatefound', () => {
                  const newWorker = reg.installing;
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // 새 버전 사용 가능
                      // console.log('[PWA] 새 버전 사용 가능');
                      // 자동 새로고침 (선택적)
                      // newWorker.postMessage('skipWaiting');
                    }
                  });
                });
              })
              .catch(err => {
                console.warn('[PWA] Service Worker 등록 실패:', err.message);
              });
          } else {
            console.info('[PWA] HTTP 환경 - Service Worker 비활성화');
          }
        });
        
        // 컨트롤러 변경 시 새로고침
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('[PWA] 새 Service Worker 활성화됨');
        });
      })();
    </script>
  </body>
