# 공통 설정 (local, prod 다 같이 씀)
spring:
    profiles:
        active: local
    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 100MB

external:
    kakao:
        map-app-key: ${KAKAO_MAP_APP_KEY:}
        # 카카오 로그인 OAuth 설정
        rest-api-key: ${KAKAO_REST_API_KEY:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        redirect-uri: ${KAKAO_REDIRECT_URI:https://aischool.daitdaing.com/api/auth/kakao/callback}

# Chatbot 동기화 설정
chatbot:
    sync:
        base-url: ${CHATBOT_SYNC_URL:http://localhost:9000}
        enabled: ${CHATBOT_SYNC_ENABLED:true}

---

# 여기부터는 prod 프로필에서만 적용
spring:
    config:
        activate:
            on-profile: prod
        import: optional:file:${ENV_FILE:prod.env}
